<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Выявление потребностей</title>
<style>
  :root{
    --bg:#eef0f4;
    --surface:#ffffff;
    --ink:#0f1115;
    --muted:#6b7280;
    --line:#e4e7ec;
    --accent:#ffcc00;
    --accent-dark:#f0bd00;
    --accent-ink:#1a1a1a;
    --ok:#0f8a4d;
    --ok-bg:#eaf8f0;
    --ok-line:#a6dcc0;
    --bad:#c62828;
    --bad-bg:#fdeeee;
    --bad-line:#f0bcbc;
    --agent-bg:#fff6d6;
    --agent-line:#e9ce6b;
    --agent-ink:#6b5300;
    --client-bg:#eaf0fd;
    --client-line:#a9bee8;
    --client-ink:#27406f;
    --radius:20px;
    --shadow-sm:0 1px 2px rgba(15,17,21,.06);
    --shadow-md:0 6px 18px rgba(15,17,21,.08);
    --shadow-lg:0 16px 40px rgba(15,17,21,.16);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:linear-gradient(180deg,#f6f7f9 0%,#eef0f4 100%);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:17px;line-height:1.5;
    -webkit-text-size-adjust:100%;
  }
  [hidden]{display:none !important}
  .app{max-width:820px;margin:0 auto;padding:22px 16px 130px;min-height:100%;display:flex;flex-direction:column}

  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .logo{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;font-weight:800;font-size:15px;color:#1a1a1a;box-shadow:0 4px 12px rgba(255,204,0,.45)}
  .topbar .name{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}

  .panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow-md);
    overflow:hidden;
  }
  .head{padding:26px 28px 20px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fffdf4 0%,#ffffff 100%)}
  h1{font-size:27px;line-height:1.18;margin:0 0 8px;letter-spacing:-.015em}
  .lead{color:var(--muted);margin:0;font-size:16px}

  .steps{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:14px 28px;border-bottom:1px solid var(--line);background:#fbfbfc}
  .step{
    font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;
    background:#fff;border:1px solid var(--line);color:#3d424a;white-space:nowrap;
  }
  .step.lead-step{background:var(--agent-bg);border-color:var(--agent-line);color:var(--agent-ink)}
  .step.final{background:var(--accent);border-color:var(--accent);color:#1a1a1a}
  .arrow{color:#c3c8d0;font-size:12px}

  .list{list-style:none;margin:0;padding:18px 20px;display:flex;flex-direction:column;gap:9px}

  .item{
    display:flex;align-items:flex-start;gap:12px;
    padding:14px 14px 14px 13px;
    background:#fff;
    border:1px solid var(--line);
    border-left:4px solid var(--line);
    border-radius:14px;
    box-shadow:var(--shadow-sm);
    cursor:grab;
    touch-action:none;
    user-select:none;-webkit-user-select:none;
    transition:box-shadow .15s,border-color .15s,background .15s,transform .15s;
  }
  .item:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
  .item:active{cursor:grabbing}
  .item:focus{outline:3px solid rgba(255,204,0,.65);outline-offset:2px}
  .item.dragging{opacity:.3}
  .item.ghost{
    position:fixed;z-index:999;pointer-events:none;
    box-shadow:var(--shadow-lg);transform:rotate(-.6deg) scale(1.015);
    background:#fff;opacity:.98;
  }
  .item .num{
    flex:0 0 auto;width:26px;height:26px;display:grid;place-items:center;
    border-radius:8px;background:#f0f2f5;color:#5b616b;
    font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;
  }
  .item .body{flex:1 1 auto;min-width:0}
  .who{
    display:inline-flex;align-items:center;gap:6px;
    font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
    padding:2px 8px 2px 3px;border-radius:999px;margin-bottom:6px;
  }
  .who .ava{
    width:17px;height:17px;border-radius:50%;display:grid;place-items:center;
    font-size:10px;font-weight:800;letter-spacing:0;
  }
  .who.agent{background:var(--agent-bg);border:1px solid var(--agent-line);color:var(--agent-ink)}
  .who.agent .ava{background:var(--agent-line);color:#4d3c00}
  .who.client{background:var(--client-bg);border:1px solid var(--client-line);color:var(--client-ink)}
  .who.client .ava{background:var(--client-line);color:#16294d}
  .item[data-role="agent"]{border-left-color:var(--agent-line)}
  .item[data-role="client"]{border-left-color:var(--client-line)}
  .text{margin:0;font-size:16px;line-height:1.42}

  .grip{
    flex:0 0 auto;width:18px;height:26px;margin-top:2px;opacity:.35;
    background-image:radial-gradient(#8b919b 1.4px,transparent 1.4px);
    background-size:6px 6px;background-position:center;
  }

  .item.ok{background:var(--ok-bg);border-color:var(--ok-line);border-left-color:var(--ok)}
  .item.ok .num{background:var(--ok);color:#fff}
  .item.bad{background:var(--bad-bg);border-color:var(--bad-line);border-left-color:var(--bad)}
  .item.bad .num{background:var(--bad);color:#fff}

  .bar{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .bar-inner{max-width:820px;margin:0 auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .score{margin-left:auto;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}

  button{
    font:inherit;cursor:pointer;border-radius:12px;border:1px solid transparent;
    transition:background .15s,border-color .15s,transform .06s,box-shadow .15s;
  }
  button:active{transform:translateY(1px)}
  button:focus-visible{outline:3px solid rgba(255,204,0,.7);outline-offset:2px}
  .btn-main{
    background:var(--accent);color:var(--accent-ink);font-weight:700;
    padding:13px 26px;border-color:var(--accent);box-shadow:0 6px 16px rgba(255,204,0,.4);
  }
  .btn-main:hover{background:var(--accent-dark)}
  .btn-ghost{background:#fff;border-color:var(--line);color:var(--ink);padding:12px 18px;font-weight:500}
  .btn-ghost:hover{background:#f7f8f9}

  .result{
    margin:0 20px 20px;padding:16px 18px;border-radius:14px;
    border:1px solid var(--line);background:#fafbfc;font-size:15px;
    animation:pop .22s ease;
  }
  @keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .result.ok{border-color:var(--ok-line);background:var(--ok-bg)}
  .result.bad{border-color:var(--bad-line);background:var(--bad-bg)}
  .result .big{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-bottom:2px;font-variant-numeric:tabular-nums}
  .result.ok .big{color:var(--ok)}
  .result.bad .big{color:var(--bad)}
  .result .msg{color:#40454d}

  .hintline{font-size:12.5px;color:#9aa0a8;text-align:center;padding:0 20px 18px}

  @media (max-width:560px){
    .head{padding:20px}
    .steps{padding:12px 16px}
    h1{font-size:22px}
    .lead{font-size:15px}
    .list{padding:14px 14px}
    .text{font-size:15px}
    .result{margin:0 14px 16px}
    .score{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="logo">Б</div>
    <div class="name">Активные продажи · этап 2</div>
  </div>

  <div class="panel">
    <div class="head">
      <h1>Выявление потребностей</h1>
      <p class="lead">Расставьте фразы агента и клиента так, как идёт настоящий диалог. Внутри каждого продукта: от какой компании → почему выбрали → стоимость.</p>
    </div>

    <div class="steps" id="steps"></div>

    <ol class="list" id="list"></ol>

    <div class="result" id="result" hidden aria-live="polite"></div>
    <div class="hintline">Перетаскивайте карточки мышью или пальцем · либо выделите карточку и двигайте стрелками ↑ ↓</div>
  </div>
</div>

<div class="bar">
  <div class="bar-inner">
    <button type="button" class="btn-main" id="check">Проверить</button>
    <button type="button" class="btn-ghost" id="shuffle">Перемешать</button>
    <span class="score" id="score"></span>
  </div>
</div>

<script>
var BLOCK_LABELS = {
  internet: "Домашний интернет",
  tv: "Телевидение",
  mobile: "Мобильная связь",
  summary: "Итог"
};

var ITEMS = [
  { block: "internet", role: "agent",  text: "От какой компании у вас домашний интернет?" },
  { block: "internet", role: "client", text: "Ростелеком, подключились несколько лет назад." },
  { block: "internet", role: "agent",  text: "Подскажите, по какой причине выбрали именно этого провайдера?" },
  { block: "internet", role: "client", text: "Тогда подошёл тариф, а потом просто не было повода менять." },
  { block: "internet", role: "agent",  text: "Сколько сейчас выходит абонентская плата за интернет?" },
  { block: "internet", role: "client", text: "600 рублей в месяц." },
  { block: "internet", role: "agent",  text: "А роутер у вас свой или от провайдера?" },
  { block: "internet", role: "client", text: "Их роутер, стоит в коридоре." },

  { block: "tv", role: "agent",  text: "А телевидением пользуетесь? Что обычно смотрите?" },
  { block: "tv", role: "client", text: "Да, в основном фильмы и сериалы." },

  { block: "mobile", role: "agent",  text: "Каким мобильным оператором пользуетесь?" },
  { block: "mobile", role: "client", text: "МТС, уже давно." },
  { block: "mobile", role: "agent",  text: "Подскажите, почему выбрали именно его?" },
  { block: "mobile", role: "client", text: "Устраивает связь, да и привыкли." },
  { block: "mobile", role: "agent",  text: "Сколько сейчас платите за мобильную связь?" },
  { block: "mobile", role: "client", text: "Около 700 рублей." },

  { block: "summary", role: "agent",  text: "Правильно понимаю, что в сумме у вас выходит около 1300 рублей?" },
  { block: "summary", role: "client", text: "Да, примерно так." }
];

(function () {
  var list = document.getElementById("list");
  var stepsEl = document.getElementById("steps");
  var resultEl = document.getElementById("result");
  var scoreEl = document.getElementById("score");
  var checkBtn = document.getElementById("check");
  var shuffleBtn = document.getElementById("shuffle");
  var order = [];

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function renderSteps() {
    stepsEl.innerHTML = "";
    var seen = [];
    ITEMS.forEach(function (it) {
      if (seen.indexOf(it.block) < 0) seen.push(it.block);
    });
    seen.forEach(function (key, i) {
      if (i > 0) {
        var a = document.createElement("span");
        a.className = "arrow";
        a.textContent = "→";
        stepsEl.appendChild(a);
      }
      var s = document.createElement("span");
      s.className = "step" + (i === 0 ? " lead-step" : "") + (key === "summary" ? " final" : "");
      s.textContent = BLOCK_LABELS[key] || key;
      stepsEl.appendChild(s);
    });
  }

  function build() {
    order = ITEMS.map(function (_, i) { return i; });
    shuffle(order);
    var straight = order.every(function (v, i) { return v === i; });
    if (straight) order.push(order.shift());
    render();
    scoreEl.textContent = "";
  }

  function render() {
    list.innerHTML = "";
    order.forEach(function (pos) {
      list.appendChild(makeCard(ITEMS[pos], pos));
    });
    numberCards();
    clearMarks();
  }

  function makeCard(it, pos) {
    var li = document.createElement("li");
    li.className = "item";
    li.setAttribute("data-pos", String(pos));
    li.setAttribute("data-role", it.role);
    li.setAttribute("tabindex", "0");

    var num = document.createElement("span");
    num.className = "num";

    var body = document.createElement("div");
    body.className = "body";

    var who = document.createElement("span");
    who.className = "who " + it.role;
    var ava = document.createElement("span");
    ava.className = "ava";
    ava.textContent = it.role === "agent" ? "А" : "К";
    who.appendChild(ava);
    who.appendChild(document.createTextNode(it.role === "agent" ? "Агент" : "Клиент"));

    var p = document.createElement("p");
    p.className = "text";
    p.textContent = it.text;

    var grip = document.createElement("span");
    grip.className = "grip";
    grip.setAttribute("aria-hidden", "true");

    body.appendChild(who);
    body.appendChild(p);
    li.appendChild(num);
    li.appendChild(body);
    li.appendChild(grip);
    return li;
  }

  function numberCards() {
    [].forEach.call(list.children, function (c, i) {
      c.querySelector(".num").textContent = String(i + 1);
    });
  }

  function clearMarks() {
    [].forEach.call(list.children, function (c) {
      c.classList.remove("ok", "bad");
    });
    resultEl.hidden = true;
    resultEl.className = "result";
  }

  function syncOrder() {
    order = [].map.call(list.children, function (c) {
      return parseInt(c.getAttribute("data-pos"), 10);
    });
    numberCards();
    clearMarks();
    scoreEl.textContent = "";
  }

  function check() {
    var cards = [].slice.call(list.children);
    var right = 0;
    cards.forEach(function (c, i) {
      var isRight = parseInt(c.getAttribute("data-pos"), 10) === i;
      c.classList.toggle("ok", isRight);
      c.classList.toggle("bad", !isRight);
      if (isRight) right++;
    });

    scoreEl.textContent = right + " / " + cards.length;
    resultEl.hidden = false;
    resultEl.className = "result " + (right === cards.length ? "ok" : "bad");
    resultEl.innerHTML =
      '<div class="big">' + right + " из " + cards.length + "</div>" +
      '<div class="msg">' + (right === cards.length
        ? "Идеально: домашний интернет → телевидение → мобильная связь → итог."
        : "Зелёные карточки на своём месте, красные — нет. Поменяйте красные и проверьте снова.") +
      "</div>";
  }

  checkBtn.addEventListener("click", check);
  shuffleBtn.addEventListener("click", build);

  var dragging = null, ghost = null, grabOffset = 0;

  function onDown(e) {
    var card = e.target.closest ? e.target.closest(".item") : null;
    if (!card || !list.contains(card)) return;
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault();
    var rect = card.getBoundingClientRect();
    grabOffset = e.clientY - rect.top;
    dragging = card;
    ghost = card.cloneNode(true);
    ghost.classList.add("ghost");
    ghost.style.width = rect.width + "px";
    ghost.style.left = rect.left + "px";
    ghost.style.top = rect.top + "px";
    document.body.appendChild(ghost);
    card.classList.add("dragging");
    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onUp);
    document.addEventListener("pointercancel", onUp);
  }

  function onMove(e) {
    if (!dragging) return;
    ghost.style.top = (e.clientY - grabOffset) + "px";
    var el = document.elementFromPoint(e.clientX, e.clientY);
    var over = el && el.closest ? el.closest(".item") : null;
    if (!over || over === dragging || !list.contains(over)) return;
    var r = over.getBoundingClientRect();
    var after = (e.clientY - r.top) > r.height / 2;
    list.insertBefore(dragging, after ? over.nextSibling : over);
    numberCards();
  }

  function onUp() {
    if (!dragging) return;
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    document.removeEventListener("pointercancel", onUp);
    dragging.classList.remove("dragging");
    if (ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);
    ghost = null;
    dragging = null;
    syncOrder();
  }

  list.addEventListener("pointerdown", onDown);

  function flip(mutate) {
    var cards = [].slice.call(list.children);
    var before = cards.map(function (c) { return c.getBoundingClientRect().top; });
    mutate();
    cards.forEach(function (c, i) {
      var now = c.getBoundingClientRect().top;
      var dy = before[i] - now;
      if (Math.abs(dy) > 1) {
        c.style.transition = "none";
        c.style.transform = "translateY(" + dy + "px)";
        requestAnimationFrame(function () {
          c.style.transition = "transform .18s ease";
          c.style.transform = "";
        });
      }
    });
  }

  list.addEventListener("keydown", function (e) {
    var card = e.target.closest ? e.target.closest(".item") : null;
    if (!card) return;
    if (e.key === "ArrowUp" && card.previousElementSibling) {
      e.preventDefault();
      flip(function () { list.insertBefore(card, card.previousElementSibling); });
      syncOrder();
      card.focus();
    } else if (e.key === "ArrowDown" && card.nextElementSibling) {
      e.preventDefault();
      flip(function () { list.insertBefore(card.nextElementSibling, card); });
      syncOrder();
      card.focus();
    }
  });

  renderSteps();
  build();
})();
</script>
</body>
</html>
